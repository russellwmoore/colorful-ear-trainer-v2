name: Run Vitest

on:
  push:
    branches:
      - main # Triggers the workflow on every push or merge to main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows a manual run from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc" # Match this to your local Node version
          cache: "npm"

      - name: Install dependencies
        run: npm ci # Faster, cleaner install for CI environments

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run Vitest tests
        run: npx vitest run
