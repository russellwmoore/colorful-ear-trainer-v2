name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Triggers the workflow on every push or merge to main
  workflow_dispatch: # Allows a manual run from the Actions tab

permissions:
  contents: read # Read-only access for checkout
  pages: write # Allows deploying to GitHub Pages
  id-token: write # Lets deploy-pages verify the deployment came from this workflow

# One deploy at a time; a newer push waits rather than cancelling one in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc" # Match this to your local Node version
          cache: "npm"

      - name: Install dependencies
        run: npm ci # Faster, cleaner install for CI environments

      - name: Run Vitest tests
        run: npx vitest run

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc" # Match this to your local Node version
          cache: "npm"

      - name: Install dependencies
        run: npm ci # Faster, cleaner install for CI environments

      - name: Build production files
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload build output
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
