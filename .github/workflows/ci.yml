name: CI

on:
  push:
    branches:
      - main # Triggers the workflow on every push or merge to main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows a manual run from the Actions tab

# A newer push to a PR cancels its older run; runs on main always finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job is its own status check, so each can be required by name in the ruleset
jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc" # Match this to your local Node version
          cache: "npm"

      - name: Install dependencies
        run: npm ci # Faster, cleaner install for CI environments

      - name: Check formatting
        run: npm run format:check

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc" # Match this to your local Node version
          cache: "npm"

      - name: Install dependencies
        run: npm ci # Faster, cleaner install for CI environments

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc" # Match this to your local Node version
          cache: "npm"

      - name: Install dependencies
        run: npm ci # Faster, cleaner install for CI environments

      - name: Run Vitest tests
        run: npx vitest run

  # Vitest strips types without checking them, so tsc only runs here
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc" # Match this to your local Node version
          cache: "npm"

      - name: Install dependencies
        run: npm ci # Faster, cleaner install for CI environments

      - name: Type check and build
        run: npm run build
